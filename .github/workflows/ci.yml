name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Pinned lock files (requirements.in -> requirements.txt via `uv pip compile --universal`).
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      # Offline: Claude is a scripted stub, pages and Wayback go through httpx.MockTransport.
      - name: Tests
        run: pytest -q

      # The recorded fictional run through the whole pipeline, no API key or network.
      - name: Demo
        run: python cli.py demo --out demo-output

      # The committed evaluation results must be reproducible from the code and the sets.
      - name: Evaluation is reproducible
        run: |
          python eval_synth.py
          python evaluate.py > /dev/null
          git diff --exit-code evals/RESULTS.md || {
            echo "::error::evals/RESULTS.md is out of date: run 'python evaluate.py' and commit the result";
            exit 1;
          }

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.14'
        with:
          name: sample-report
          path: demo-output/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t due-diligence-agent:ci .

      # The container starts, answers /health and runs a background job end to end
      # (registries only: no API key in CI).
      - name: Smoke test
        run: |
          docker run -d --name dd -p 8000:8000 due-diligence-agent:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          job=$(curl -sf -X POST http://127.0.0.1:8000/jobs -H 'Content-Type: application/json' \
            -d '{"subject":{"type":"company","name":"Demo LLP","identifier":"123456789012","purpose":"CI container smoke test"},"operator":"ci","deep":false}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])')
          for i in $(seq 1 30); do
            status=$(curl -sf http://127.0.0.1:8000/jobs/$job | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "job $job: $status"
            [ "$status" = done ] && exit 0
            [ "$status" = failed ] && { docker logs dd; exit 1; }
            sleep 1
          done
          docker logs dd; exit 1
